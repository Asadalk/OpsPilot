services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: opspilot
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host access for local tools only; not published on other interfaces.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      # Optional so a fresh clone starts; without a key, set LLM_PROVIDER=mock or add GROQ_API_KEY.
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://opspilot:opspilot@postgres:5432/opspilot
      KNOWLEDGE_DIR: /knowledge
    volumes:
      - ./knowledge:/knowledge:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # /health answers only after startup finished (settings check, migrations, knowledge ingestion).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
